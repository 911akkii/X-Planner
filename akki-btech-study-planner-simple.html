<!DOCTYPE html>
<html>
<head>
<title>AKKI B.Tech Smart Study Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    background:linear-gradient(135deg,#05051a,#10104d,#001d35);
}
header{
    text-align:center;
    padding:20px;
    background:#080820;
}
h1{margin:5px;color:#00eaff}
.container{padding:15px;max-width:1100px;margin:auto}
.card{
    background:rgba(255,255,255,.08);
    padding:15px;
    margin:15px 0;
    border-radius:15px;
}
button,select,input{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:0;
}
button{
    background:#00cfff;
    cursor:pointer;
}
button:hover{background:#00ffcc}
input,select{background:white;color:#111}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:10px;
    border:1px solid #555;
    text-align:center;
}
th{background:#111b50}
.day{
    background:#111;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
}
.classItem{
    background:#18286b;
    padding:8px;
    margin:5px;
    border-radius:7px;
}
.progress{
    background:#333;
    border-radius:10px;
    height:20px;
}
.progress div{
    background:#00eaff;
    height:20px;
    border-radius:10px;
}
textarea{width:95%;height:70px}
</style>
</head>

<body>

<header>
<h1>🤖 AKKI Smart Study Planner</h1>
<p>B.Tech College Study Management System</p>
<b>DEVELOPER AKKI</b>
</header>

<div class="container">

<div class="card">
<h2>🎓 Student Settings</h2>

<input id="student" placeholder="Student Name">

<select id="branch">
<option>CSE</option>
<option>ECE</option>
<option>EL</option>
<option>CV</option>
</select>

<input id="college" placeholder="College Name">

<button onclick="saveSettings()">Save Settings</button>

<p id="profile"></p>
</div>


<div class="card">
<h2>📅 Add Class</h2>

<select id="day">
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
<option>Saturday</option>
<option>Sunday</option>
</select>

<input id="subject" placeholder="Subject">

<input id="time" type="time">

<input id="teacher" placeholder="Teacher">

<input id="room" placeholder="Room/Lab">

<button onclick="addClass()">Add Class</button>
</div>


<div class="card">
<h2>📚 Weekly Timetable</h2>
<div id="schedule"></div>
</div>


<div class="card">
<h2>📝 Study Task</h2>

<input id="task" placeholder="Enter assignment or study task">

<input id="date" type="date">

<button onclick="addTask()">Add Task</button>

<div id="tasks"></div>
</div>


<div class="card">
<h2>📊 Attendance</h2>

<input id="attended" type="number" placeholder="Classes Attended">

<input id="total" type="number" placeholder="Total Classes">

<button onclick="attendance()">Calculate</button>

<h2 id="attendanceResult">0%</h2>

<div class="progress">
<div id="attendanceBar" style="width:0%"></div>
</div>
</div>


<div class="card">
<h2>⏱️ Study Timer</h2>

<h1 id="timer">25:00</h1>

<button onclick="startTimer()">Start</button>
<button onclick="stopTimer()">Stop</button>
<button onclick="resetTimer()">Reset</button>
</div>


<div class="card">
<h2>💡 Quick Study Notes</h2>

<textarea id="notes" placeholder="Write your study notes here..."></textarea>

<br>

<button onclick="saveNotes()">Save Notes</button>

<p id="savedNotes"></p>
</div>


<div class="card">
<h2>⚙️ Customisation</h2>

<label>Background:</label>

<select onchange="changeBackground(this.value)">
<option value="ai">AI Blue</option>
<option value="purple">Purple</option>
<option value="green">Green</option>
<option value="black">Dark</option>
</select>

<button onclick="clearData()">Clear All Data</button>
</div>

</div>


<script>

let classes=JSON.parse(localStorage.getItem("classes"))||[];
let taskList=JSON.parse(localStorage.getItem("tasks"))||[];

function saveSettings(){

localStorage.setItem("student",student.value);
localStorage.setItem("branch",branch.value);
localStorage.setItem("college",college.value);

showProfile();

}

function showProfile(){

let s=localStorage.getItem("student")||"Student";
let b=localStorage.getItem("branch")||"CSE";
let c=localStorage.getItem("college")||"B.Tech College";

profile.innerHTML=
"<b>"+s+"</b> | Branch: "+b+" | "+c;

student.value=s;
branch.value=b;
college.value=c;

}

function addClass(){

let obj={
day:day.value,
subject:subject.value,
time:time.value,
teacher:teacher.value,
room:room.value
};

classes.push(obj);

localStorage.setItem("classes",JSON.stringify(classes));

subject.value="";
time.value="";
teacher.value="";
room.value="";

showSchedule();

}

function showSchedule(){

let html="";

let days=[
"Monday","Tuesday","Wednesday",
"Thursday","Friday","Saturday","Sunday"
];

days.forEach(function(d){

html+="<div class='day'><h3>"+d+"</h3>";

let found=classes.filter(c=>c.day==d);

if(found.length==0){

html+="No classes";

}

found.forEach(function(c,i){

html+=
"<div class='classItem'>"+
"<b>"+c.subject+"</b><br>"+
"⏰ "+c.time+"<br>"+
"👨‍🏫 "+c.teacher+"<br>"+
"🏫 "+c.room+
" <button onclick='deleteClass("+classes.indexOf(c)+")'>Delete</button>"+
"</div>";

});

html+="</div>";

});

schedule.innerHTML=html;

}

function deleteClass(i){

classes.splice(i,1);

localStorage.setItem("classes",JSON.stringify(classes));

showSchedule();

}


function addTask(){

if(task.value=="")return;

taskList.push({
name:task.value,
date:date.value,
done:false
});

localStorage.setItem("tasks",JSON.stringify(taskList));

task.value="";
date.value="";

showTasks();

}

function showTasks(){

let html="";

taskList.forEach(function(t,i){

html+=
"<div class='classItem'>"+
"<input type='checkbox' "+
(t.done?"checked":"")+
" onchange='completeTask("+i+")'> "+
t.name+" | "+t.date+
" <button onclick='deleteTask("+i+")'>Delete</button>"+
"</div>";

});

tasks.innerHTML=html;

}

function completeTask(i){

taskList[i].done=!taskList[i].done;

localStorage.setItem("tasks",JSON.stringify(taskList));

showTasks();

}

function deleteTask(i){

taskList.splice(i,1);

localStorage.setItem("tasks",JSON.stringify(taskList));

showTasks();

}


function attendance(){

let a=Number(attended.value);
let t=Number(total.value);

if(t==0)return;

let p=Math.round((a/t)*100);

attendanceResult.innerHTML=p+"%";
attendanceBar.style.width=p+"%";

}


let seconds=1500;
let timerInterval;

function updateTimer(){

let m=Math.floor(seconds/60);
let s=seconds%60;

timer.innerHTML=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

}

function startTimer(){

if(timerInterval)return;

timerInterval=setInterval(function(){

if(seconds>0){

seconds--;
updateTimer();

}else{

clearInterval(timerInterval);
timerInterval=null;
alert("🎉 Study session completed!");

}

},1000);

}

function stopTimer(){

clearInterval(timerInterval);
timerInterval=null;

}

function resetTimer(){

stopTimer();

seconds=1500;

updateTimer();

}


function saveNotes(){

localStorage.setItem("notes",notes.value);

savedNotes.innerHTML="Notes saved ✓";

}

function changeBackground(type){

if(type=="purple")
document.body.style.background=
"linear-gradient(135deg,#19002e,#6500a8,#160033)";

else if(type=="green")
document.body.style.background=
"linear-gradient(135deg,#001a12,#006b52,#001c18)";

else if(type=="black")
document.body.style.background=
"#050505";

else
document.body.style.background=
"linear-gradient(135deg,#05051a,#10104d,#001d35)";

}

function clearData(){

if(confirm("Delete all planner data?")){

localStorage.clear();
location.reload();

}

}


showProfile();
showSchedule();
showTasks();

notes.value=localStorage.getItem("notes")||"";

updateTimer();

</script>

</body>
</html>
